name: test

on:
  push:
    branches: [trunk, 'feat/**']
  pull_request:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf2.0-dev libgraphene-1.0-dev \
            libmecab-dev mecab mecab-ipadic-utf8 \
            libssl-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-

      - name: Run cargo test
        run: cargo test --workspace
