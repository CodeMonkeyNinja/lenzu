name: release

# Build the Lenzu single-bundle AppImage and publish it as a GitHub Release.
#
# Triggers:
#   - push of a tag matching v*  (the canonical release path)
#   - manual workflow_dispatch    (for dry-runs that build but skip publish)
#
# What it produces (attached to the release):
#   lenzu-bundle-X.Y.Z.tar               -- one-file mega-bundle
#   lenzu-X.Y.Z-x86_64.appimage          -- standalone AppImage
#   lenzu-models-dbnet-0.2.0.tar.xz      -- AGPL DBNet sidecar
#   lenzu-models-manga-ocr-0.1.0.tar.xz  -- Apache-2.0 manga-ocr sidecar
#
# scripts/lenzu-appimage-installer.sh hardcodes the URL pattern
#   https://github.com/CodeMonkeyNinja/lenzu/releases/download/<tag>/<asset>
# so end users running the installer just work once the tag is pushed.
#
# Storage policy: only the two most recent releases are retained.  Older
# releases are deleted at the end of every successful run (their git tags
# are kept — only the binary assets are reclaimed).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (otherwise just upload as Actions artifact)'
        type: boolean
        default: false

permissions:
  contents: write   # needed to create releases and delete old ones

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf2.0-dev libgraphene-1.0-dev \
            libmecab-dev mecab mecab-ipadic-utf8 \
            libssl-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libxkbcommon-x11-dev \
            libfuse2 \
            curl xz-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # manga-ocr-rs's build.rs downloads ~440MB to $HOME/.cache/manga-ocr-rs
      # the first time.  Cache it so subsequent runs are fast.
      - name: Cache manga-ocr models
        uses: actions/cache@v4
        with:
          path: ~/.cache/manga-ocr-rs
          key: manga-ocr-cache-v1

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('lenzu_server/pnpm-lock.yaml') }}

      - name: Install lenzu_server JS deps
        working-directory: lenzu_server
        run: pnpm install --frozen-lockfile

      # The AGPL DBNet model is intentionally NOT in this repo's history
      # (license isolation — keeps CodeMonkeyNinja/lenzu pure MIT).  Fetch
      # it from the HidekiAI/lenzu-prototypes archive's release at build
      # time and feed it to make-installers.sh via LENZU_DBNET_ONNX.
      - name: Fetch DBNet model (AGPL-3.0, license-isolated)
        run: |
          mkdir -p /tmp/dbnet
          curl -fsSL -o /tmp/dbnet/dbnet.tar.xz \
            https://github.com/HidekiAI/lenzu-prototypes/releases/download/v0.1.0/lenzu-models-dbnet-0.2.0.tar.xz
          tar -xJf /tmp/dbnet/dbnet.tar.xz -C /tmp/dbnet
          # Layout inside the sidecar tarball:
          #   .local/share/lenzu/models/stabrise-text_detection_dbnet_ml_v02_model.onnx
          DBNET_PATH=/tmp/dbnet/.local/share/lenzu/models/stabrise-text_detection_dbnet_ml_v02_model.onnx
          [[ -f "$DBNET_PATH" ]] || { echo "DBNet model not found after extraction"; exit 1; }
          echo "LENZU_DBNET_ONNX=$DBNET_PATH" >> $GITHUB_ENV

      - name: Build bundle
        run: scripts/make-installers.sh --ci

      - name: Show artifacts
        run: ls -lh target/appimage/

      - uses: actions/upload-artifact@v4
        with:
          name: lenzu-bundle
          path: |
            target/appimage/lenzu-bundle-*.tar
            target/appimage/lenzu-*-x86_64.appimage
            target/appimage/lenzu-models-*.tar.xz
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the pushed tag, or for manual dispatch derive a -dev tag from the commit.
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == "$GITHUB_REF" ]]; then
            TAG="dev-$(git rev-parse --short HEAD)"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # Body comes from RELEASE_NOTES.md so the install/quick-start prose
          # is checked into the repo, not buried in the YAML.  Edit that file
          # to update what end users see on the release page.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            target/appimage/lenzu-bundle-*.tar \
            target/appimage/lenzu-*-x86_64.appimage \
            target/appimage/lenzu-models-*.tar.xz

      # Storage policy: keep only the 2 most recent releases.  Tags are kept
      # (cheap git refs); only the release object + binary assets are deleted.
      - name: Prune old releases (keep latest 2)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t TO_DELETE < <(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName')
          for tag in "${TO_DELETE[@]}"; do
            echo "Deleting old release: $tag (keeping git tag)"
            gh release delete "$tag" --yes || true
          done
