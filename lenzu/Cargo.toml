[package]
name = "lenzu"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Transparent OCR lens overlay for Linux desktop with Japanese-language support"
homepage = "https://github.com/CodeMonkeyNinja/lenzu"
repository = "https://github.com/CodeMonkeyNinja/lenzu"
authors = ["Hideki A. Ikeda"]
publish = false

[[bin]]
name = "lenzu"
path = "src/main.rs"

[[bin]]
name = "ocr-test"
path = "src/bin/ocr_test.rs"

[package.metadata.deb]
name = "lenzu"
maintainer = "Hideki A. Ikeda <hidekiai@CodeMonkeyNinja.dev@users.noreply.github.com>"
copyright = "2023, Hideki A. Ikeda <hidekiai@CodeMonkeyNinja.dev@users.noreply.github.com>"
license-file = ["../LICENSE", "0"]
extended-description = """\
Lenzu is a transparent, screen-region OCR lens for Linux desktop.
It captures a user-defined screen region, runs OCR (local or remote
backend), and displays results in a heads-up overlay (lenzu-hud).
The HUD package (lenzu-hud) must be installed alongside this one."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/lenzu", "usr/bin/", "755"],
    ["../packaging/lenzu/lenzu.desktop", "usr/share/applications/", "644"],
    ["../packaging/lenzu/lenzu.png", "usr/share/icons/hicolor/256x256/apps/lenzu.png", "644"],
    ["../README.md", "usr/share/doc/lenzu/README.md", "644"],
    ["../LICENSE", "usr/share/doc/lenzu/copyright", "644"],
    ["NOTICES.md", "usr/share/doc/lenzu/NOTICES.md", "644"],
    ["NOTICES.crates.md", "usr/share/doc/lenzu/NOTICES.crates.md", "644"],
]
depends = "$auto, mecab-ipadic-utf8, fonts-noto-cjk, fonts-ipafont-gothic, lenzu-hud"
recommends = "lenzu-models-dbnet"

[features]
default = ["onnx"]
onnx = ["jp_detect/onnx"]

[dependencies]
anyhow = "1.0"
jp_detect = "0.2.3"
manga-ocr-rs = "0.1.3"
mecab-furigana-rs = "0.3.0"
gtk4 = { version = "0.11", features = ["v4_14"] }
gdk4-x11 = "0.11"
async-channel = "2"
gdk-pixbuf = "0.22"
cairo-rs = "0.22"
pango = "0.22"
pangocairo = "0.22"
x11rb = { version = "0.13", features = ["all-extensions"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.4"
chrono = "0.4"
isolang = { version = "2.4.0" , features = ["serde"]}
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
wiremock = "0.6"
